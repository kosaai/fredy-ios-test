{
  "name": "Unsigned iPhone IPA",
  "run-name": "Unsigned iPhone IPA | ${{ inputs.build_tag }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "build_tag": {
          "description": "Unique Oracle monitor correlation tag",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "build-unsigned": {
      "name": "Build unsigned iPhone IPA",
      "runs-on": "macos-26",
      "timeout-minutes": 25,
      "steps": [
        {
          "name": "Checkout exact dispatched commit",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify macOS 26 and available Xcode device SDK",
          "run": "set -euo pipefail\npython3 -c 'import platform; assert platform.system() == \"Darwin\"; assert platform.mac_ver()[0].split(\".\")[0] == \"26\"'\nxcode-select -p\nxcodebuild -version\nxcrun --sdk iphoneos --show-sdk-version\n"
        },
        {
          "name": "Compile Release iphoneos arm64 without signing",
          "run": "set -euo pipefail\nmkdir -p build\nxcodebuild -project FredyTest.xcodeproj -scheme FredyTest -configuration Release \\\n  -sdk iphoneos -destination 'generic/platform=iOS' -arch arm64 \\\n  -derivedDataPath build/DerivedData \\\n  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \\\n  DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' \\\n  ARCHS=arm64 ONLY_ACTIVE_ARCH=NO ENABLE_DEBUG_DYLIB=NO \\\n  build 2>&1 | tee build/xcodebuild.log\n"
        },
        {
          "name": "Package and verify actual unsigned device IPA",
          "run": "set -euo pipefail\nAPP='build/DerivedData/Build/Products/Release-iphoneos/FredyTest.app'\ntest -d \"$APP\"\ntest \"$(xcrun lipo -archs \"$APP/FredyTest\")\" = arm64\nif /usr/bin/codesign -d \"$APP\" >/dev/null 2>&1; then\n  printf '%s\\n' 'Unexpected app code signature'\n  exit 1\nfi\nmkdir -p build/package/Payload build/output\n/usr/bin/ditto \"$APP\" build/package/Payload/FredyTest.app\n(cd build/package && /usr/bin/zip -qry ../output/FredyTest-Unsigned.ipa Payload)\npython3 tools/verify_unsigned_ipa.py build/output/FredyTest-Unsigned.ipa | tee build/output/FredyTest-Unsigned.verify.json\n"
        },
        {
          "name": "Upload verified unsigned IPA",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "FredyTest-Unsigned-${{ github.run_id }}",
            "path": "build/output/FredyTest-Unsigned.ipa\nbuild/output/FredyTest-Unsigned.verify.json",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "Retain build diagnostics only on failure",
          "if": "failure()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "FredyTest-Build-Logs-${{ github.run_id }}",
            "path": "build/xcodebuild.log",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
